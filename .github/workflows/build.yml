name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore "BCLYT Editor.sln"
      - run: msbuild "BCLYT Editor.sln" /p:Configuration=Release
      - uses: actions/upload-artifact@v4
        with:
          name: BCLYT_Editor
          path: "BCLYT Editor/bin/Release/"
